<!DOCTYPE html>
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanzApp - Simulador de Inversión</title>

  <!-- Fonts y Tailwind -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#11a4d4",
            "background-light": "#f6f8f8",
            "background-dark": "#101d22",
          },
          fontFamily: {
            display: ["Manrope"],
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px",
          },
        },
      },
    };
  </script>
</head>

<body class="font-display bg-background-light dark:bg-background-dark text-stone-900 dark:text-white">
  <div class="flex flex-col min-h-screen">

    <!-- Header -->
    <header class="flex items-center justify-between p-4 bg-background-light dark:bg-background-dark sticky top-0 z-10">
      <button class="p-2 rounded-full hover:bg-primary/10">
        <span class="material-symbols-outlined text-stone-900 dark:text-white">menu</span>
      </button>
      <h1 class="text-base sm:text-lg font-bold text-stone-900 dark:text-white text-center flex-1">Simulador de Inversión</h1>
      <div class="w-8"></div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 space-y-8">

      <!-- Portafolio Actual -->
      <section>
        <h2 class="text-xl font-bold mb-4">Portafolio Actual</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-primary/10 dark:bg-primary/20 p-4 rounded-lg">
            <p class="text-sm text-stone-700 dark:text-stone-300">Valor Total</p>
            <p class="text-2xl font-bold text-stone-900 dark:text-white">S/ 15,000</p>
          </div>
          <div class="bg-primary/10 dark:bg-primary/20 p-4 rounded-lg">
            <p class="text-sm text-stone-700 dark:text-stone-300">Rendimiento</p>
            <p class="text-2xl font-bold text-green-500">+5.2%</p>
          </div>
        </div>
      </section>

      <!-- Operaciones -->
      <section>
        <h2 class="text-xl font-bold mb-4">Operaciones</h2>
        <div class="space-y-4">
          <select class="form-select w-full rounded-lg bg-white dark:bg-background-dark border border-stone-300 dark:border-stone-600 text-stone-900 dark:text-white">
            <option selected>Seleccionar Activo</option>
            <option>Acciones Tech</option>
            <option>Bonos del Estado</option>
            <option>Criptomonedas</option>
          </select>

          <input type="number" placeholder="Cantidad" class="form-input w-full rounded-lg bg-white dark:bg-background-dark border border-stone-300 dark:border-stone-600 text-stone-900 dark:text-white" />

          <div class="flex flex-col sm:flex-row gap-4">
            <button class="w-full h-12 rounded-lg bg-primary text-white font-bold">Comprar</button>
            <button class="w-full h-12 rounded-lg bg-stone-200 dark:bg-stone-700 text-stone-900 dark:text-white font-bold">Vender</button>
          </div>
        </div>
      </section>

      <!-- Consejos -->
      <section>
        <h2 class="text-xl font-bold mb-4">Consejos del Asistente</h2>
        <div class="bg-primary/10 dark:bg-primary/20 p-4 rounded-lg flex items-start gap-3">
          <span class="material-symbols-outlined text-primary mt-1">lightbulb</span>
          <p class="text-sm text-stone-800 dark:text-stone-200">
            Recuerda ahorrar al menos el 20% de tu presupuesto y diversificar tu portafolio para reducir riesgos.
          </p>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="sticky bottom-0 bg-white dark:bg-background-dark border-t border-stone-200 dark:border-stone-800">
      <nav
            class="fixed bottom-0 left-0 right-0 border-t border-white/10 bg-background-light/80 backdrop-blur-sm dark:bg-background-dark/80">
            <div class="flex h-16 justify-around">
                <a class="flex flex-1 flex-col items-center justify-center gap-1 text-gray-600 dark:text-gray-400"
                    href="principal.html">
                    <svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M218.83,103.77l-80-75.48a1.14,1.14,0,0,1-.11-.11,16,16,0,0,0-21.53,0l-.11.11L37.17,103.77A16,16,0,0,0,32,115.55V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V160h32v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V115.55A16,16,0,0,0,218.83,103.77ZM208,208H160V160a16,16,0,0,0-16-16H112a16,16,0,0,0-16,16v48H48V115.55l.11-.1L128,40l79.9,75.43.11.1Z">

                        </path>
                    </svg>
                    <p class="text-xs font-medium">Registros</p>
                </a>
                <a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary" href="metas.html">
                    <div class="rounded-full bg-primary/20 p-3">
                        <svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24"
                            xmlns="http://www.w3.org/2000/svg">

                            </path>
                        </svg>
                    </div>
                    <p class="text-xs font-medium">Metas</p>
                </a>
                <a class="flex flex-1 flex-col items-center justify-center gap-1 text-gray-600 dark:text-gray-400"
                    href="comunidadForo.html">
                    <svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M140,128a12,12,0,1,1-12-12A12,12,0,0,1,140,128ZM84,116a12,12,0,1,0,12,12A12,12,0,0,0,84,116Zm88,0a12,12,0,1,0,12,12A12,12,0,0,0,172,116Zm60,12A104,104,0,0,1,79.12,219.82L45.07,231.17a16,16,0,0,1-20.24-20.24l11.35-34.05A104,104,0,1,1,232,128Zm-16,0A88,88,0,1,0,51.81,172.06a8,8,0,0,1,.66,6.54L40,216,77.4,203.53a7.85,7.85,0,0,1,2.53-.42,8,8,0,0,1,4,1.08A88,88,0,0,0,216,128Z">

                    <p class="text-xs font-medium">Comunidad</p>

                <a class="flex flex-1 flex-col items-center justify-center gap-1 text-gray-600 dark:text-gray-400"

                    <svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24"

                        </path>
                    </svg>
                    <p class="text-xs font-medium">Ofertas</p>
                </a>
            </div>
        </nav>>
    </footer>
  </div>
</body>

</html>
