<!DOCTYPE html>
<html class="dark" lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanzApp - Trivia</title>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#11a4d4',
            'background-light': '#f6f8f8',
            'background-dark': '#101d22',
          },
          fontFamily: {
            display: ['Manrope'],
          }
        }
      }
    }
  </script>

  <style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;
    }

    body {
      min-height: 100dvh;
    }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white">

  <!-- Contenedor principal -->
  <div class="flex flex-col min-h-screen px-4 sm:px-6 lg:px-8">
    <header
            class="sticky top-0 z-10 flex items-center justify-between border-b border-white/10 bg-background-light/80 px-4 py-3 backdrop-blur-sm dark:bg-background-dark/80">
            <button class="text-gray-600 dark:text-gray-400">
                <svg fill="currentColor" height="24" viewBox="0 0 256 256" width="24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z">
                    </path>
                </svg>
            </button>
            <h1 class="text-lg font-bold text-gray-900 dark:text-white">Mi Progreso</h1>
            <div class="w-6"></div>
        </header>
    <!-- Pregunta -->
    <main class="flex-grow flex flex-col items-center pt-10 pb-28">
      <div class="w-full max-w-2xl space-y-6">
        <!-- Header de progreso -->
        <div>
          <h1 class="text-2xl font-bold mb-8">Trivias financieras</h1>
          <div class="flex justify-between items-center text-sm mb-2">
            
            <p class="text-slate-600 dark:text-slate-400">Pregunta 1 de 4</p>
            <p class="text-primary font-semibold">Score: 0</p>
          </div>
          <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2">
            <div class="bg-primary h-2 rounded-full" style="width: 25%;"></div>
          </div>
        </div>

        <!-- Texto de la pregunta -->
        <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white leading-snug">
          ¿Qué es el TCA (Tasa de Costo Anual) en una tarjeta de crédito?
        </h2>

        <!-- Opciones -->
        <div class="space-y-3">
          <label
            class="flex items-start sm:items-center gap-4 p-4 border rounded-lg cursor-pointer border-slate-300 dark:border-slate-700 transition has-[:checked]:border-primary has-[:checked]:bg-primary/10">
            <input type="radio" name="trivia-option"
              class="w-5 h-5 text-primary bg-transparent border-slate-400 dark:border-slate-600 focus:ring-primary focus:ring-2 checked:border-primary" />
            <span class="text-base text-slate-700 dark:text-slate-300">Tasa de interés anual sin incluir comisiones.</span>
          </label>

          <label
            class="flex items-start sm:items-center gap-4 p-4 border rounded-lg cursor-pointer border-slate-300 dark:border-slate-700 transition has-[:checked]:border-primary has-[:checked]:bg-primary/10">
            <input type="radio" name="trivia-option"
              class="w-5 h-5 text-primary bg-transparent border-slate-400 dark:border-slate-600 focus:ring-primary focus:ring-2 checked:border-primary" />
            <span class="text-base text-slate-700 dark:text-slate-300">Costo total anual del crédito, incluyendo intereses y comisiones.</span>
          </label>

          <label
            class="flex items-start sm:items-center gap-4 p-4 border rounded-lg cursor-pointer border-slate-300 dark:border-slate-700 transition has-[:checked]:border-primary has-[:checked]:bg-primary/10">
            <input type="radio" name="trivia-option"
              class="w-5 h-5 text-primary bg-transparent border-slate-400 dark:border-slate-600 focus:ring-primary focus:ring-2 checked:border-primary" />
            <span class="text-base text-slate-700 dark:text-slate-300">Monto mínimo a pagar mensualmente.</span>
          </label>

          <label
            class="flex items-start sm:items-center gap-4 p-4 border rounded-lg cursor-pointer border-slate-300 dark:border-slate-700 transition has-[:checked]:border-primary has-[:checked]:bg-primary/10">
            <input type="radio" name="trivia-option"
              class="w-5 h-5 text-primary bg-transparent border-slate-400 dark:border-slate-600 focus:ring-primary focus:ring-2 checked:border-primary" />
            <span class="text-base text-slate-700 dark:text-slate-300">Límite de crédito disponible.</span>
          </label>
        </div>
      </div>
    </main>

                            </path>
