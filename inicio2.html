<!DOCTYPE html>
<html class="dark" lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinanzApp - Login</title>

  <!-- Google Fonts & Material Symbols -->
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
  <link href="https://fonts.googleapis.com/css2?display=swap&family=Manrope:wght@400;500;700;800" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#11a4d4',
            'background-light': '#f6f8f8',
            'background-dark': '#101d22',
          },
          fontFamily: {
            display: ['Manrope'],
          },
          borderRadius: {
            DEFAULT: '0.25rem',
            lg: '0.5rem',
            xl: '0.75rem',
            full: '9999px',
          },
        },
      },
    }
  </script>
  <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>

  <style>
    body {
      min-height: 100dvh;
    }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white">
  <div class="flex flex-col min-h-screen px-4 sm:px-6 lg:px-8">
    <!-- Contenido principal -->
    <main class="flex-grow flex flex-col justify-center items-center">
      <!-- Logo y encabezado -->
      <div class="w-full max-w-md space-y-6 text-center">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-xl bg-primary/20 dark:bg-primary/30">
          <span class="material-symbols-outlined text-primary text-4xl">savings</span>
        </div>
        <h1 class="text-3xl font-bold">FinanzApp</h1>
      </div>

      <!-- Formulario -->
      <div class="mt-10 w-full max-w-md">
        <a href="inicio3.html">
          <button
            class="mt-6 w-full h-12 flex items-center justify-center rounded-lg bg-primary text-white text-base font-bold hover:bg-primary/90 transition">
            Online
          </button>
        </a>
        <!-- Social Buttons -->
        <div class="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
          <a href="inicio3.html">
            <button
              class="flex items-center justify-center gap-2 w-full h-12 px-4 rounded-lg bg-primary/10 dark:bg-primary/20 text-primary font-bold transition hover:bg-primary/20">
              <span>Offline</span>
            </button>
          </a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="mt-12 pb-6 text-center">
        <p class="text-xs text-gray-500 dark:text-gray-400 text-center">
                Continua, si estas de acuerdo con nuestros <a class="font-medium text-primary hover:underline" href="#">Terminos de Servicios</a> y <a class="font-medium text-primary hover:underline" href="#">Politica de privacidad</a>.
        </p>
    </footer>
  </div>
</body>

</html>
